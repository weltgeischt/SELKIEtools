[build-system]
requires = ['setuptools>=64']
build-backend = 'setuptools.build_meta'


[project]
name = 'SELKIEtools'
version = '0.1.0'
requires-python = '>=3.9'
dependencies = [
    'GitPython>=3.1.47',
    'matplotlib>=3.10.9',
    'numpy>=2.2.4',
    'pandas>=2.3.3',
    'PyYAML>=6.0.3',
    'scipy>=1.15.1',
    'openpyxl>=3.1.5',
    'xlsxwriter>=3.3.0'
]


[project.scripts]
selkie = 'selkietools.cli:main'

[tool.setuptools.packages.find]
where = ["src"]
